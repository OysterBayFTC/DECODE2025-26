/**
 * Top-level build file for ftc_app project.
 *
 * It is extraordinarily rare that you will ever need to edit this file.
 */

buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        // Note for FTC Teams: Do not modify this yourself.
        classpath 'com.android.tools.build:gradle:8.7.0'
    }
}

// This is now required because aapt2 has to be downloaded from the
// google() repository beginning with version 3.2 of the Android Gradle Plugin
allprojects {
    repositories {
        mavenCentral()
        google()
    }

    // Redirect build directory to a local folder outside of OneDrive to prevent AccessDeniedException.
    // OneDrive often locks files in the 'build' directory during sync.
    def rootBuildDir = new File("C:/temp/BIOBUZZ-build", rootProject.name)
    project.layout.buildDirectory.set(new File(rootBuildDir, project.path.replace(":", "/")))
}

repositories {
    mavenCentral()
}
